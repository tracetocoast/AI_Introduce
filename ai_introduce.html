<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 发展介绍 · 年表放映</title>
<style>
*{box-sizing:border-box}
html{color-scheme:dark}
html,body{margin:0;height:100%}
body{background:#080a0f;color:#f5f6fa;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit}
button{cursor:pointer}
a{text-decoration:none}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.bar{position:fixed;z-index:9;top:0;left:0;width:100%;height:56px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:18px;background:#080a0fcc;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12;font-size:12px}
.brand{font-weight:560;letter-spacing:-.02em}
.bar nav{display:flex;gap:26px;color:#aaa}
.bar nav a:hover{color:#fff}
.here{color:#d5e4ff}
.tag{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:#92baff}
.fraction{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:#c5d4ee}
.slide-progress{position:fixed;z-index:10;top:56px;left:0;height:2px;width:100%;background:#ffffff10}
.slide-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#80b5ff,#cf9dff)}
.app{height:100dvh;padding-top:58px;display:flex;flex-direction:column;min-height:0}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px,1.05fr) minmax(360px,.95fr)}
.exhibit{position:relative;overflow:hidden;padding:36px 28px 78px;background:radial-gradient(ellipse at 50% 78%,var(--glow,#38517c66),transparent 58%),linear-gradient(165deg,#1a2436 0%,#0c1018 56%,#080a0f 100%);display:grid;place-items:center}
.halo-wrap{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.halo{position:relative;width:min(74%,560px);aspect-ratio:1;border:1px solid #ffffff14;border-radius:50%;box-shadow:inset 0 0 90px #83adff16,0 0 80px #83adff0d;animation:spin 46s linear infinite}
.halo:before,.halo:after{content:"";position:absolute;inset:12%;border:1px solid #c4d8ff1c;border-radius:50%}
.halo:after{inset:24%;border-color:#ffffff10}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink 1.1s steps(2,end) infinite}
.exhibit-index{position:absolute;z-index:2;top:26px;left:28px}
.exhibit-label{position:absolute;z-index:2;left:28px;right:28px;bottom:26px;display:flex;justify-content:space-between;gap:16px;align-items:flex-end}
.exhibit-label b{font-weight:400;font-size:15px;letter-spacing:-.02em}
.exhibit-art{position:relative;z-index:1;min-width:0;min-height:0;height:min(100%,460px);width:auto;max-width:100%;aspect-ratio:1;animation:rise .55s ease}
.exhibit-art svg{width:100%;height:100%;overflow:visible}
.net-node{fill:#172131;stroke:#98b8eb;stroke-width:2}
.net-node.flash{animation:nodeFlash .65s ease-in-out}
@keyframes nodeFlash{0%,100%{fill:#172131;filter:none}45%{fill:#d3e3ff;filter:drop-shadow(0 0 16px #8bb9ff)}}
.copy{min-width:0;min-height:0;overflow:auto;border-left:1px solid #ffffff10;padding:28px 6vw 28px 48px;background:radial-gradient(ellipse at 80% 0%,#20375633,transparent 46%)}
.copy-block{width:min(640px,100%);margin:auto;animation:rise .5s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.year{margin:8px 0 0;font-size:clamp(68px,7.4vw,108px);font-weight:500;letter-spacing:-.08em;line-height:.86;background:linear-gradient(#fff,#9ca9bf);-webkit-background-clip:text;background-clip:text;color:transparent}
.copy h1{margin:14px 0 8px;font-size:clamp(26px,2.5vw,38px);font-weight:400;letter-spacing:-.045em;line-height:1.22}
.en{margin:0 0 16px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;color:#92baff}
.lead{margin:0;max-width:58ch;color:#a5a8b2;font-size:15px;line-height:1.9}
aside{margin-top:20px;border-left:2px solid #8bb9ff;padding:12px 16px;background:#ffffff08;color:#a8c7ff;line-height:1.75;font-size:14px}
aside b{display:block;margin-bottom:4px;color:#fff;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:400;letter-spacing:.14em;opacity:.62}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.who span{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#d5e2f8;border:1px solid #ffffff22;border-radius:99px;padding:7px 11px;background:#ffffff08}
.dock{flex:none;height:calc(var(--track-h) + 48px);background:#0c0f16;border-top:1px solid #ffffff14;display:flex;flex-direction:column;position:relative}
.dock-bar{height:48px;padding:0 22px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #ffffff0c}
.hint{color:#7f8795;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
.transport{margin-left:auto;display:flex;align-items:center;gap:8px}
.transport button,.play{border:1px solid #ffffff30;border-radius:99px;background:#ffffff09;color:#d5d8e0;padding:8px 12px;line-height:1}
.play{background:#b8d2ff;color:#10141b;border-color:transparent;padding:8px 16px;font-weight:500}
.play:hover{filter:brightness(1.05)}
.transport button:hover{border-color:#ffffff55;color:#fff}
.track{height:var(--track-h);overflow-x:auto;overflow-y:hidden;padding-inline:calc(50% - 84px);scroll-padding-inline:calc(50% - 84px);scrollbar-width:thin;scrollbar-color:#60769a #ffffff0c;overscroll-behavior-x:contain;cursor:grab}
.track.dragging{cursor:grabbing}
.track-inner{position:relative;height:var(--node-h);width:max-content;display:flex;gap:22px}
.rail{position:absolute;top:var(--mid);height:1px;background:#ffffff2e;transform:translateY(-50%);pointer-events:none}
.rail i{display:block;height:100%;width:0;background:linear-gradient(90deg,#80b5ff,#cf9dff)}
.node{position:relative;width:168px;height:var(--node-h);flex:none;border:0;background:none;padding:0;color:inherit;text-align:left;-webkit-tap-highlight-color:transparent}
.card{position:absolute;left:0;right:0;height:var(--card-h);padding:9px 12px 8px;border:1px solid #ffffff1c;border-radius:12px;background:#121820;transition:border-color .25s,background .25s,transform .25s}
.node.up .card{top:0}
.node.down .card{bottom:0}
.node.up .card:after,.node.down .card:before{content:"";position:absolute;left:50%;width:1px;height:var(--stem);background:#ffffff3a}
.node.up .card:after{top:100%}
.node.down .card:before{bottom:100%}
.card small{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#92baff}
.card strong,.card em{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card strong{margin-top:3px;font-size:14px;font-weight:450;letter-spacing:-.02em}
.card em{margin-top:1px;font-style:normal;font-size:12px;color:#9297a2}
.dot{position:absolute;z-index:2;left:50%;top:var(--mid);width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);background:#383f4d;border:1px solid #9ca4b3;transition:.25s}
.node:hover .card{border-color:#ffffff42}
.node:hover .dot,.node.active .dot{background:#9dc3ff;box-shadow:0 0 0 6px #8bb9ff24,0 0 16px #8bb9ff}
.node.active .card{border-color:#9dc3ffaa;background:linear-gradient(160deg,#243044,#141a24);transform:translateY(0)}
.node.future .card{border-style:dashed}
.node:focus-visible,.play:focus-visible,.transport button:focus-visible{outline:1px solid #9dc3ff;outline-offset:3px}
:root{--node-h:220px;--card-h:72px;--stem:32px;--mid:110px;--track-h:236px}
@media(max-height:820px){
  :root{--node-h:188px;--card-h:62px;--stem:26px;--mid:94px;--track-h:204px}
  .copy{padding-top:18px;padding-bottom:18px}
  .year{font-size:76px}
  .lead{font-size:14px}
}
@media(max-width:900px){
  .bar{padding:0 16px}
  .bar nav{display:none}
  .stage{grid-template-columns:1fr;grid-template-rows:minmax(148px,20vh) minmax(0,1fr)}
  .exhibit{padding:22px 16px 48px}
  .copy{border-left:0;border-top:1px solid #ffffff10;padding:14px 18px 10px}
  .exhibit-art{width:min(52%,210px)}
  .hint{display:none}
  .year{font-size:52px}
  .copy h1{font-size:24px;margin:8px 0 6px}
  .en{margin-bottom:10px}
  .lead{font-size:14px;line-height:1.75}
  aside,.who{margin-top:12px}
  :root{--node-h:156px;--card-h:54px;--stem:18px;--mid:78px;--track-h:172px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>

<script>
const events = [
  {id:'turing', year:'1950', short:'图灵', gloss:'模仿游戏', place:'英国 · 《Mind》', kicker:'COMPUTING MACHINERY AND INTELLIGENCE', title:'图灵把“思考”变成可以观察的游戏', en:'Can machines think?', people:['艾伦·图灵'], glow:'#3c5d8c73', point:'把“会不会思考”改写成“像不像在思考”。', text:'1950 年，艾伦·图灵在《计算机器与智能》里没有争论机器有没有意识。他提出模仿游戏：评审只通过文字交谈，判断对面是人还是机器。智能第一次被写成可以观察、可以讨论的行为。'},
  {id:'dartmouth', year:'1956', short:'达特茅斯', gloss:'学科命名', place:'达特茅斯学院', kicker:'A PROPOSAL FOR THE DARTMOUTH SUMMER PROJECT', title:'达特茅斯会议，人工智能得名', en:'Artificial Intelligence', people:['约翰·麦卡锡','马文·明斯基','克劳德·香农','纳撒尼尔·罗切斯特'], glow:'#3d5a4888', point:'一次夏季研讨，给领域命名，也定下共同议程。', text:'1956 年夏天，麦卡锡、明斯基、香农与罗切斯特在达特茅斯学院聚会。提案第一次把这个方向称为 Artificial Intelligence，并相信学习与推理可以被精确描述，再交给机器模拟。会议没有立刻交出通用方法，学科却从此有了名字。'},
  {id:'symbol', year:'1956–', short:'符号主义', gloss:'规则与搜索', place:'逻辑 · 搜索 · Lisp', kicker:'SYMBOLS, RULES, AND SEARCH', title:'符号、规则与搜索', en:'The physical symbol system', people:['艾伦·纽厄尔','赫伯特·西蒙','约翰·麦卡锡'], glow:'#3a4d7a80', point:'早期主线：用符号表示问题，再用规则和搜索去解。', text:'达特茅斯之后的主线认为，智能可以写成符号，以及对符号施加的规则与搜索。Logic Theorist 证明了部分逻辑定理，通用问题求解器用“手段—目的”分析拆开问题，Lisp 则用来书写这些程序。形式题目里它很强，常识和例外却写不完。'},
  {id:'perceptron', year:'1958', short:'感知机', gloss:'从例子调权重', place:'罗森布拉特 · 1958', kicker:'THE PERCEPTRON', title:'感知机：用权重学习一个判断', en:'A neuron that learns its weights', people:['弗兰克·罗森布拉特','沃伦·麦卡洛克','沃尔特·皮茨'], glow:'#355f7a80', point:'另一条路线几乎同时起步：不写规则，而调节连接的权重。', text:'1958 年，罗森布拉特的感知机把输入乘上权重，加总后超过阈值就做出判断，并能按例子调整权重。它能学会线性可分的简单图形。1969 年，明斯基与帕珀特指出单层结构处理不了异或，连接主义随之边缘化。1986 年的反向传播重新打开多层网络，只是数据和算力都还不够。'},
  {id:'winter1', year:'1974', short:'第一次寒冬', gloss:'承诺遇冷', place:'莱特希尔报告之后', kicker:'THE FIRST AI WINTER', title:'第一次寒冬：承诺碰到了边界', en:'Ambition met its limits', people:['詹姆斯·莱特希尔','资助机构与实验室'], glow:'#2c3b5588', point:'退潮来自能力、资金和期待之间的落差。', text:'机器翻译和自动推理在小题目里能演示，一进开放世界就失效。1973 年英国莱特希尔报告质疑这些承诺，此后数年资助明显收缩。算力不足、数据稀缺，手写规则又躲不开组合爆炸。寒冬不是某一篇论文单独造成的。'},
  {id:'expert', year:'1980', short:'专家系统', gloss:'知识写成规则', place:'斯坦福 · DEC', kicker:'KNOWLEDGE IN THE MACHINE', title:'专家系统：把知识写进规则', en:'If this, then that', people:['爱德华·费根鲍姆','爱德华·肖特利夫'], glow:'#3e568073', point:'先放弃通用智能，把一个行业的经验写成可执行判断。', text:'费根鲍姆把路线收窄：与其追求通用推理，不如把专家经验写成“如果……那么……”。MYCIN 用规则辅助细菌感染的用药判断，DEC 的 XCON 则真正用来配置计算机订单。知识库加推理引擎证明了窄领域的价值，也把高昂的维护成本一起带进系统。'},
  {id:'winter2', year:'1987', short:'第二次寒冬', gloss:'产业退潮', place:'Lisp 机器与专家系统', kicker:'THE SECOND AI WINTER', title:'第二次寒冬：专用系统退潮', en:'The market cooled', people:['专家系统产业','实验室与资助方'], glow:'#2a354c88', point:'规则可以创造订单，却难以低成本地跟上新情况。', text:'1987 年前后，普通工作站追上了专用 Lisp 机器，专家系统又难更新、不能从新数据里学习。产业泡沫退去，日本第五代计算机计划也没有达到宣传中的高度。经费再次变冷，但从样本中学习的方法已经在统计学里长出来。'},
  {id:'ml', year:'1990', short:'机器学习', gloss:'经验代替规则', place:'从规则转向样本', kicker:'LEARNING FROM EXAMPLES', title:'机器学习：让程序随经验变好', en:'Performance improves with experience', people:['阿瑟·塞缪尔','汤姆·米切尔'], glow:'#3a567488', point:'主线从“把知识写进程序”换成“让程序从例子里改进”。', text:'“机器学习”这个说法可以追溯到 1959 年塞缪尔的跳棋程序。它成为主线，是在专家系统退潮之后：决策树、贝叶斯方法和强化学习不再要求人事先写完规则。1997 年深蓝靠搜索战胜卡斯帕罗夫，和这条路线并不是一回事，却一起改写了人们对机器能力的判断。'},
  {id:'stat', year:'1995', short:'统计学习', gloss:'讨论如何泛化', place:'支持向量机前后', kicker:'STATISTICAL LEARNING THEORY', title:'统计学习：追问凭什么能泛化', en:'From finite samples to new data', people:['弗拉基米尔·万普尼克'], glow:'#3c4f78', point:'有限样本上学到的规律，需要一张能解释推广能力的契约。', text:'万普尼克等人把“会不会在新数据上失效”写成可分析的问题。理论比产品更早，1995 年前后支持向量机以最大间隔分开两类，让这套方法进入文本和分类系统。Boosting 与概率图模型也在同一时期成熟。深度学习之前，工业里的许多模型靠的是间隔、正则和概率。'},
  {id:'deep', year:'2006', short:'深度学习', gloss:'表示学习', place:'深层网络重回主线', kicker:'LEARNING REPRESENTATIONS', title:'深度学习：让网络自己形成表示', en:'Layer-wise pretraining', people:['杰弗里·辛顿','扬·乐昆','约书亚·本吉奥'], glow:'#3d4e88', point:'少设计特征，让多层变换自己抽出结构。', text:'2006 年，辛顿、奥辛德罗与 Teh 用逐层预训练，让深层信念网络重新变得可训练。乐昆和本吉奥推动的表示学习更进一步：少做人工特征，让多层变换自己发现边缘、部件和概念。那时 GPU 还不是标准工具，但“深度”已经回到研究主线。'},
  {id:'alexnet', year:'2012', short:'AlexNet', gloss:'视觉转折', place:'ImageNet · 2012', kicker:'IMAGENET AND ALEXNET', title:'AlexNet 拉开视觉的差距', en:'Deep convolutional networks on GPU', people:['亚历克斯·克里热夫斯基','伊利亚·苏茨克维','杰弗里·辛顿','李飞飞'], glow:'#3a6290', point:'数据、GPU 和深层卷积第一次组成可复制的系统。', text:'ImageNet 提供了百万级标注图像。2012 年，克里热夫斯基、苏茨克维和辛顿的 AlexNet 用 GPU 训练深层卷积网络，把 top-5 错误率降到约 15.3%，明显甩开传统视觉方法。卷积、ReLU、Dropout 和数据增强从此不再只是边缘实验。'},
  {id:'alphago', year:'2016', short:'AlphaGo', gloss:'战胜李世石', place:'首尔 · 2016 年 3 月', kicker:'A GAME WITH TOO MANY FUTURES', title:'AlphaGo 走进巨大的搜索空间', en:'Policy, value, and search', people:['DeepMind AlphaGo 团队'], glow:'#3e5a48', point:'规则清楚、变化极多的任务里，学来的判断补上了纯搜索。', text:'2016 年 3 月，AlphaGo 以 4 比 1 战胜围棋世界冠军李世石。策略网络负责挑棋，价值网络估计胜负，蒙特卡洛树搜索再把两者嵌进推演。次年的 AlphaGo Zero 主要依靠自我对弈。它的意义超出棋盘：评估函数可以学出来，而不必全部手写。'},
  {id:'transformer', year:'2017', short:'Transformer', gloss:'注意力架构', place:'《Attention Is All You Need》', kicker:'ATTENTION IS ALL YOU NEED', title:'Transformer：注意力成为骨架', en:'Relate any two positions directly', people:['Ashish Vaswani 等八位作者'], glow:'#4a4580', point:'序列中任意两个位置可以直接比较，训练因此更容易并行。', text:'2017 年，这篇论文用自注意力取代循环。模型不再按时间一步步传递隐藏状态，而是同时衡量序列里各位置的关系。它先用于机器翻译，随后成为 GPT 与 BERT 共用的骨架。多头注意力和位置编码，是后来大模型的基本语法。'},

function pad(n){return String(n).padStart(2,'0');}
let flashTimer=0, flashGen=0;
function stopNetFlash(){
  flashGen++;
  clearInterval(flashTimer);
  flashTimer=0;
}
function startNetFlash(){
  stopNetFlash();
  const gen=flashGen;
  const pulse=()=>{
    if(gen!==flashGen) return;
    art.querySelectorAll('.net-node').forEach((n,i)=>setTimeout(()=>{
      if(gen!==flashGen||!n.isConnected) return;
      n.classList.add('flash');
      setTimeout(()=>{if(n.isConnected) n.classList.remove('flash')},700);
    },i*90));
  };
  pulse();
  flashTimer=setInterval(pulse,3000);
}
function paint(){
  const e=events[index];
  exhibit.style.setProperty('--glow', e.glow);
  document.getElementById('exhibitIndex').textContent=pad(index+1);
  document.getElementById('exhibitKicker').textContent=e.kicker;
  document.getElementById('exhibitPlace').textContent=e.place;
  art.innerHTML=scene(e.id, e.title);
  if(e.id==='deep'||e.id==='alexnet') startNetFlash();
  else stopNetFlash();
  copyBlock.innerHTML=`<span class="tag">${pad(index+1)} / ${pad(events.length)} · ${e.short}</span><div class="year">${e.year}</div><h1>${e.title}</h1><p class="en">${e.en}</p><p class="lead">${e.text}</p><aside><b>这一步留下了什么</b>${e.point}</aside><div class="who">${e.people.map(p=>`<span>${p}</span>`).join('')}</div>`;
  nodes.forEach((node,i)=>{
    node.classList.toggle('active', i===index);
    if(i===index) node.setAttribute('aria-current','true');
    else node.removeAttribute('aria-current');
  });
  document.getElementById('fraction').textContent=`${pad(index+1)} / ${pad(events.length)}`;
  live.textContent=`${e.year}，${e.title}`;
  if(!playing) slideBar.style.width=(index/(events.length-1)*100)+'%';
  art.style.animation='none';
  copyBlock.style.animation='none';
  void art.offsetWidth;
  art.style.animation='';
  copyBlock.style.animation='';
}
function layoutRail(){
  if(!nodes.length) return;
  const inner=trackInner.getBoundingClientRect();
  const first=nodes[0].getBoundingClientRect();
  const last=nodes[nodes.length-1].getBoundingClientRect();
  const cur=nodes[index].getBoundingClientRect();
  const start=first.left+first.width/2-inner.left;
  const end=last.left+last.width/2-inner.left;
  const at=cur.left+cur.width/2-inner.left;
  rail.style.left=start+'px';
  rail.style.width=Math.max(0,end-start)+'px';
  railFill.style.width=Math.max(0,at-start)+'px';
}
function centerNode(smooth){
  const node=nodes[index];
  if(!node) return;
  const nodeRect=node.getBoundingClientRect();
  const trackRect=track.getBoundingClientRect();
  const delta=(nodeRect.left+nodeRect.width/2)-(trackRect.left+trackRect.width/2);
  track.scrollTo({left:track.scrollLeft+delta, behavior:smooth?'smooth':'auto'});
}
function show(i, smooth){
  index=Math.max(0, Math.min(events.length-1, i));
  paint();
  requestAnimationFrame(()=>{layoutRail();centerNode(smooth);});
}
function playLabel(){playBtn.textContent=playing?'暂停':ended?'重新放映':'开始放映';}
function stopPlayback(){
  playing=false;
  elapsed=0;
  cancelAnimationFrame(raf);
  playLabel();
}
function toggle(){
  if(playing){
    elapsed=performance.now()-started;
    playing=false;
    cancelAnimationFrame(raf);
    playLabel();
    return;
  }
  if(ended){
    ended=false;
    elapsed=0;
    show(0,false);
  }
  playing=true;
  started=performance.now()-elapsed;
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(tick);
  playLabel();
}
function tick(now){
  if(!playing) return;
  const p=Math.min(1,(now-started)/DURATION);
  slideBar.style.width=(p*100)+'%';
  if(p>=1){
    elapsed=0;
    if(index>=events.length-1){
      playing=false;
      ended=true;
      playLabel();
      slideBar.style.width='100%';
      return;
    }
    show(index+1,true);
    started=performance.now();
  }
  raf=requestAnimationFrame(tick);
}
function step(dir){
  const next=index+dir;
  if(next<0||next>=events.length) return;
  ended=false;
  elapsed=0;
  if(playing) started=performance.now();
  show(next,true);
}
function jump(i){
  if(suppressClick) return;
  if(i===index && !playing) return;
  stopPlayback();
  ended=false;
  show(i,true);
}

rail=document.createElement('div');
rail.className='rail';
railFill=document.createElement('i');
rail.append(railFill);
trackInner.append(rail);
events.forEach((e,i)=>{
  const b=document.createElement('button');
  b.type='button';
  b.className='node '+(i%2?'down':'up')+(e.future?' future':'');
  b.setAttribute('aria-label', `${e.year} ${e.short}，${e.gloss}`);
  b.innerHTML=`<i class="dot"></i><span class="card"><small>${e.year}</small><strong>${e.short}</strong><em>${e.gloss}</em></span>`;
  b.addEventListener('click',()=>jump(i));
  trackInner.append(b);
  nodes.push(b);
});

let dragging=false,moved=false,startX=0,startScroll=0,pointerId=0;
track.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse'||e.button!==0) return;
  dragging=true; moved=false; startX=e.clientX; startScroll=track.scrollLeft; pointerId=e.pointerId;
});
track.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const dx=e.clientX-startX;
  if(Math.abs(dx)>5 && !moved){
    moved=true;
    track.classList.add('dragging');
    track.setPointerCapture(pointerId);
  }
  if(moved) track.scrollLeft=startScroll-dx;
});
function endDrag(){dragging=false;track.classList.remove('dragging');}
track.addEventListener('pointerup',endDrag);
track.addEventListener('pointercancel',endDrag);
track.addEventListener('click',e=>{
  if(!moved) return;
  suppressClick=true;
  e.preventDefault();
  e.stopPropagation();
  moved=false;
  setTimeout(()=>{suppressClick=false;},0);
},true);
track.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)) return;
  track.scrollLeft+=e.deltaY;
  e.preventDefault();
},{passive:false});

playBtn.addEventListener('click',toggle);
document.getElementById('prev').addEventListener('click',()=>step(-1));
document.getElementById('next').addEventListener('click',()=>step(1));
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea') return;
  if(e.key==='ArrowRight'){e.preventDefault();step(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
  else if(e.key===' '){e.preventDefault();toggle();}
  else if(e.key==='Home'){e.preventDefault();jump(0);}
  else if(e.key==='End'){e.preventDefault();jump(events.length-1);}
});
window.addEventListener('resize',()=>{layoutRail();centerNode(false);});
show(0,false);
playLabel();
</script>
</body>
</html>
