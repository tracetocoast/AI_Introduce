<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 发展介绍 · 年表放映</title>
<style>
*{box-sizing:border-box}
html{color-scheme:dark}
html,body{margin:0;height:100%}
body{background:#080a0f;color:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;font-size:18px;font-weight:400;-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit}
button{cursor:pointer}
a{text-decoration:none}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.bar{position:fixed;z-index:9;top:0;left:0;width:100%;height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:18px;background:#080a0fcc;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12;font-size:18px}
.brand{font-weight:560;letter-spacing:-.02em}
.bar nav{display:flex;gap:26px;color:#e8eaef}
.bar nav a:hover{color:#fff}
.here{color:#e7f0ff}
.tag{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:#c5dcff}
.fraction{font:16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#e7f0ff}
.slide-progress{position:fixed;z-index:10;top:64px;left:0;height:2px;width:100%;background:#ffffff10}
.slide-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#80b5ff,#cf9dff)}
.app{height:100dvh;padding-top:66px;display:flex;flex-direction:column;min-height:0}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px,1.05fr) minmax(360px,.95fr)}
.exhibit{position:relative;overflow:hidden;padding:18px 20px 52px;background:radial-gradient(ellipse at 50% 78%,var(--glow,#38517c66),transparent 58%),linear-gradient(165deg,#1a2436 0%,#0c1018 56%,#080a0f 100%);display:grid;place-items:center}
.halo-wrap{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.halo{position:relative;width:min(74%,560px);aspect-ratio:1;border:1px solid #ffffff14;border-radius:50%;box-shadow:inset 0 0 90px #83adff16,0 0 80px #83adff0d;animation:spin 46s linear infinite}
.halo:before,.halo:after{content:"";position:absolute;inset:12%;border:1px solid #c4d8ff1c;border-radius:50%}
.halo:after{inset:24%;border-color:#ffffff10}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink 1.1s steps(2,end) infinite}
.exhibit-index{position:absolute;z-index:2;top:26px;left:28px}
.exhibit-label{position:absolute;z-index:2;left:20px;right:20px;bottom:12px;display:flex;justify-content:space-between;gap:16px;align-items:flex-end}
.exhibit-label b{font-weight:500;font-size:20px;letter-spacing:-.02em}
.exhibit-art{position:relative;z-index:1;min-width:0;min-height:0;height:min(100%,460px);width:auto;max-width:100%;aspect-ratio:1;animation:rise .55s ease}
.exhibit-art svg{width:100%;height:100%;overflow:visible}
.exhibit-art.photo,.exhibit-art.pair{aspect-ratio:auto;width:100%;height:auto;max-height:100%}
.exhibit-art.photo{display:grid;place-items:center}
.exhibit-art.photo img{display:block;max-width:100%;width:auto;height:auto;max-height:min(680px,calc(100dvh - var(--dock-h) - 148px));object-fit:contain;border-radius:16px;box-shadow:0 18px 46px #00000073}
.exhibit-art.pair{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:18px;height:min(680px,calc(100dvh - var(--dock-h) - 148px))}
.exhibit-art.pair img{border-radius:12px;box-shadow:0 12px 32px #00000066;object-fit:contain}
.exhibit-art.pair .diagram{width:52%;height:auto;max-height:100%;background:#f6f3ec;padding:14px 16px}
.exhibit-art.pair .portrait{width:auto;max-width:46%;height:auto;max-height:100%}
.net-node{fill:#172131;stroke:#98b8eb;stroke-width:2}
.net-node.flash{animation:nodeFlash .65s ease-in-out}
@keyframes nodeFlash{0%,100%{fill:#172131;filter:none}45%{fill:#d3e3ff;filter:drop-shadow(0 0 16px #8bb9ff)}}
.copy{min-width:0;min-height:0;overflow:auto;border-left:1px solid #ffffff10;padding:28px 6vw 28px 48px;background:radial-gradient(ellipse at 80% 0%,#20375633,transparent 46%)}
.copy-block{width:min(760px,100%);margin:auto;animation:rise .5s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.year{margin:8px 0 0;font-size:clamp(56px,5.6vw,84px);font-weight:500;letter-spacing:-.06em;line-height:.9;background:linear-gradient(#fff,#e4e9f2);-webkit-background-clip:text;background-clip:text;color:transparent}
.copy h1{margin:12px 0 8px;font-size:clamp(32px,2.8vw,42px);font-weight:500;letter-spacing:-.04em;line-height:1.28}
.copy h1 a{color:inherit;text-decoration:underline;text-underline-offset:.16em;text-decoration-thickness:2px;text-decoration-color:#9dc3ff}
.copy h1 a:hover{color:#fff;text-decoration-color:#fff}
.en{margin:0 0 16px;font:16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;color:#c5dcff}
.lead{margin:0;max-width:62ch;color:#e7e9ef;font-size:20px;line-height:1.85}
aside{margin-top:20px;border-left:2px solid #8bb9ff;padding:14px 18px;background:#ffffff08;color:#e7f0ff;line-height:1.75;font-size:18px}
aside b{display:block;margin-bottom:4px;color:#fff;font:15px ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:400;letter-spacing:.12em}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.who .person{font:15px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.4;color:#eef3fb;border:1px solid #ffffff22;border-radius:99px;padding:8px 12px;background:#ffffff08;transition:.25s}
.who .person:hover,.who .person:focus-visible{border-color:#f4f8ff;color:#fff;transform:translateY(-4px);box-shadow:0 0 0 1px #fff,0 0 0 4px #c5dcff,0 0 14px #eaf4ff}
.bio-pop{position:fixed;z-index:12;overflow:auto;padding:18px 20px;border-radius:16px;background:#101722f7;border:1px solid #9dc3ffaa;box-shadow:0 18px 50px #000c;color:#f4f7fb;font-size:17px;line-height:1.72;text-align:left}
.bio-pop[hidden]{display:none}
.bio-pop p{margin:0 0 10px}
.bio-pop p:last-child{margin:0}
.bio-pop b{color:#fff;font-weight:600}
.dock{flex:none;height:calc(var(--track-h) + 48px);background:#0c0f16;border-top:1px solid #ffffff14;display:flex;flex-direction:column;position:relative}
.dock-bar{height:48px;padding:0 22px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #ffffff0c}
.hint{color:#d5dce8;font:15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}
.transport{margin-left:auto;display:flex;align-items:center;gap:8px}
.transport button,.play{border:1px solid #ffffff30;border-radius:99px;background:#ffffff09;color:#d5d8e0;padding:8px 12px;line-height:1}
.play{background:#b8d2ff;color:#10141b;border-color:transparent;padding:8px 16px;font-weight:500}
.play:hover{filter:brightness(1.05)}
.transport button:hover{border-color:#ffffff55;color:#fff}
.track{height:var(--track-h);overflow-x:auto;overflow-y:hidden;padding-inline:calc(50% - 110px);scroll-padding-inline:calc(50% - 110px);scrollbar-width:thin;scrollbar-color:#60769a #ffffff0c;overscroll-behavior-x:contain;cursor:grab}
.track.dragging{cursor:grabbing}
.track-inner{position:relative;height:var(--node-h);width:max-content;display:flex;gap:22px}
.rail{position:absolute;top:var(--mid);height:1px;background:#ffffff2e;transform:translateY(-50%);pointer-events:none}
.rail i{display:block;height:100%;width:0;background:linear-gradient(90deg,#80b5ff,#cf9dff)}
.node{position:relative;width:220px;height:var(--node-h);flex:none;border:0;background:none;padding:0;color:inherit;text-align:left;-webkit-tap-highlight-color:transparent}
.card{position:absolute;left:0;right:0;height:var(--card-h);padding:9px 12px 8px;border:1px solid #ffffff1c;border-radius:12px;background:#121820;transition:border-color .25s,background .25s,transform .25s}
.node.up .card{top:0}
.node.down .card{bottom:0}
.node.up .card:after,.node.down .card:before{content:"";position:absolute;left:50%;width:1px;height:var(--stem);background:#ffffff3a}
.node.up .card:after{top:100%}
.node.down .card:before{bottom:100%}
.card small{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;color:#c5dcff}
.card strong,.card em{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card strong{margin-top:3px;font-size:18px;font-weight:500;letter-spacing:-.02em}
.card em{margin-top:1px;font-style:normal;font-size:16px;color:#e4e7ee}
.dot{position:absolute;z-index:2;left:50%;top:var(--mid);width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);background:#383f4d;border:1px solid #9ca4b3;transition:.25s}
.node:hover .card{border-color:#ffffff42}
.node:hover .dot,.node.active .dot{background:#9dc3ff;box-shadow:0 0 0 6px #8bb9ff24,0 0 16px #8bb9ff}
.node.active .card{border-color:#9dc3ffaa;background:linear-gradient(160deg,#243044,#141a24);transform:translateY(0)}
.node.future .card{border-style:dashed}
.node:focus-visible,.play:focus-visible,.transport button:focus-visible{outline:1px solid #9dc3ff;outline-offset:3px}
:root{--node-h:268px;--card-h:96px;--stem:36px;--mid:134px;--track-h:284px;--dock-h:calc(var(--track-h) + 48px)}
@media(max-height:820px){
  :root{--node-h:230px;--card-h:86px;--stem:28px;--mid:115px;--track-h:246px}
  .copy{padding-top:18px;padding-bottom:18px}
  .year{font-size:64px}
  .lead{font-size:18px}
}
@media(max-width:900px){
  .bar{padding:0 16px}
  .bar nav{display:none}
  .stage{grid-template-columns:1fr;grid-template-rows:minmax(148px,20vh) minmax(0,1fr)}
  .exhibit{padding:22px 16px 48px}
  .copy{border-left:0;border-top:1px solid #ffffff10;padding:14px 18px 10px}
  .exhibit-art{width:min(52%,210px)}
  .exhibit-art.photo,.exhibit-art.pair{width:min(92%,340px);height:100%}
  .exhibit-art.photo img{max-height:18vh}
  .exhibit-art.pair{flex-direction:row;gap:8px}
  .exhibit-art.pair .diagram{width:56%;max-height:100%;padding:4px}
  .exhibit-art.pair .portrait{max-width:42%;max-height:100%}
  .hint{display:none}
  .year{font-size:52px}
  .copy h1{font-size:30px;margin:8px 0 6px}
  .en{margin-bottom:10px}
  .lead{font-size:18px;line-height:1.75}
  aside,.who{margin-top:12px}
  :root{--node-h:200px;--card-h:82px;--stem:20px;--mid:100px;--track-h:216px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>

<script>
const events = [
  {id:'turing', year:'1950', short:'图灵', gloss:'模仿游戏', place:'英国 · 《Mind》', kicker:'COMPUTING MACHINERY AND INTELLIGENCE', title:'图灵把“思考”变成可以观察的游戏', en:'Can machines think?', people:['艾伦·图灵'], glow:'#3c5d8c73', point:'把“会不会思考”改写成“像不像在思考”。', text:'1950 年，艾伦·图灵在《计算机器与智能》里没有争论机器有没有意识。他提出模仿游戏：评审只通过文字交谈，判断对面是人还是机器。智能第一次被写成可以观察、可以讨论的行为。'},
  {id:'dartmouth', year:'1956', short:'达特茅斯', gloss:'学科命名', place:'达特茅斯学院', kicker:'A PROPOSAL FOR THE DARTMOUTH SUMMER PROJECT', title:'达特茅斯会议，人工智能得名', en:'Artificial Intelligence', people:['约翰·麦卡锡','马文·明斯基','克劳德·香农','纳撒尼尔·罗切斯特'], glow:'#3d5a4888', point:'一次夏季研讨，给领域命名，也定下共同议程。', text:'1956 年夏天，麦卡锡、明斯基、香农与罗切斯特在达特茅斯学院聚会。提案第一次把这个方向称为 Artificial Intelligence，并相信学习与推理可以被精确描述，再交给机器模拟。会议没有立刻交出通用方法，学科却从此有了名字。'},
  {id:'symbol', year:'1956–', short:'符号主义', gloss:'规则与搜索', place:'逻辑 · 搜索 · Lisp', kicker:'SYMBOLS, RULES, AND SEARCH', title:'符号、规则与搜索', en:'The physical symbol system', people:['艾伦·纽厄尔','赫伯特·西蒙','约翰·麦卡锡'], glow:'#3a4d7a80', point:'早期主线：用符号表示问题，再用规则和搜索去解。', text:'达特茅斯之后的主线认为，智能可以写成符号，以及对符号施加的规则与搜索。Logic Theorist 证明了部分逻辑定理，通用问题求解器用“手段—目的”分析拆开问题，Lisp 则用来书写这些程序。形式题目里它很强，常识和例外却写不完。'},
  {id:'perceptron', year:'1958', short:'感知机', gloss:'从例子调权重', place:'罗森布拉特 · 1958', kicker:'THE PERCEPTRON', title:'感知机：用权重学习一个判断', href:'https://www.itseyland.com/Lab/Perceptron.html', en:'A neuron that learns its weights', people:['弗兰克·罗森布拉特','沃伦·麦卡洛克','沃尔特·皮茨'], glow:'#355f7a80', point:'另一条路线几乎同时起步：不写规则，而调节连接的权重。', text:'1958 年，罗森布拉特的感知机把输入乘上权重，加总后超过阈值就做出判断，并能按例子调整权重。它能学会线性可分的简单图形。1969 年，明斯基与帕珀特指出单层结构处理不了异或，连接主义随之边缘化。1986 年的反向传播重新打开多层网络，只是数据和算力都还不够。'},
  {id:'winter1', year:'1974', short:'第一次寒冬', gloss:'承诺遇冷', place:'莱特希尔报告之后', kicker:'THE FIRST AI WINTER', title:'第一次寒冬：承诺碰到了边界', en:'Ambition met its limits', people:['詹姆斯·莱特希尔','资助机构与实验室'], glow:'#2c3b5588', point:'退潮来自能力、资金和期待之间的落差。', text:'机器翻译和自动推理在小题目里能演示，一进开放世界就失效。1973 年英国莱特希尔报告质疑这些承诺，此后数年资助明显收缩。算力不足、数据稀缺，手写规则又躲不开组合爆炸。寒冬不是某一篇论文单独造成的。'},
  {id:'expert', year:'1980', short:'专家系统', gloss:'知识写成规则', place:'斯坦福 · DEC', kicker:'KNOWLEDGE IN THE MACHINE', title:'专家系统：把知识写进规则', en:'If this, then that', people:['爱德华·费根鲍姆','爱德华·肖特利夫'], glow:'#3e568073', point:'先放弃通用智能，把一个行业的经验写成可执行判断。', text:'费根鲍姆把路线收窄：与其追求通用推理，不如把专家经验写成“如果……那么……”。MYCIN 用规则辅助细菌感染的用药判断，DEC 的 XCON 则真正用来配置计算机订单。知识库加推理引擎证明了窄领域的价值，也把高昂的维护成本一起带进系统。'},
  {id:'ml', year:'1986', short:'反向传播', gloss:'辛顿提出理论', place:'杰弗里·辛顿 · 1986', kicker:'BACKPROPAGATION', title:'辛顿提出反向传播理论', href:'https://playground.tensorflow.org/?utm_source=chatgpt.com#activation=relu&batchSize=10&dataset=circle&regDataset=reg-plane&learningRate=0.001&regularizationRate=0&noise=0&networkShape=4,2&seed=0.86858&showTestData=false&discretize=false&percTrainData=50&x=true&y=true&xTimesY=false&xSquared=false&ySquared=false&cosX=false&sinX=false&cosY=false&sinY=false&collectStats=false&problem=classification&initZero=false&hideText=false', en:'Error propagated back through the layers', people:['杰弗里·辛顿','戴维·鲁梅尔哈特','罗纳德·威廉姆斯'], glow:'#3a567488', point:'误差从输出往回传，多层网络的权重因此可以一起调整。', text:'1986 年，杰弗里·辛顿与戴维·鲁梅尔哈特、罗纳德·威廉姆斯提出反向传播：把输出端的误差从后向前逐层传回，按每一层的责任调整权重。多层网络从此可以按例子学习，而不必只停留在单层感知机。'},
  {id:'winter2', year:'1987', short:'第二次寒冬', gloss:'产业退潮', place:'Lisp 机器与专家系统', kicker:'THE SECOND AI WINTER', title:'第二次寒冬：专用系统退潮', en:'The market cooled', people:['专家系统产业','实验室与资助方'], glow:'#2a354c88', point:'规则可以创造订单，却难以低成本地跟上新情况。', text:'1987 年前后，普通工作站追上了专用 Lisp 机器，专家系统又难更新、不能从新数据里学习。产业泡沫退去，日本第五代计算机计划也没有达到宣传中的高度。经费再次变冷，但从样本中学习的方法已经在统计学里长出来。'},
  {id:'stat', year:'1995', short:'统计学习', gloss:'讨论如何泛化', place:'支持向量机前后', kicker:'STATISTICAL LEARNING THEORY', title:'统计学习：追问凭什么能泛化', en:'From finite samples to new data', people:['弗拉基米尔·万普尼克'], glow:'#3c4f78', point:'有限样本上学到的规律，需要一张能解释推广能力的契约。', text:'万普尼克等人把“会不会在新数据上失效”写成可分析的问题。理论比产品更早，1995 年前后支持向量机以最大间隔分开两类，让这套方法进入文本和分类系统。Boosting 与概率图模型也在同一时期成熟。深度学习之前，工业里的许多模型靠的是间隔、正则和概率。'},
  {id:'deep', year:'2006', short:'深度学习', gloss:'表示学习', place:'深层网络重回主线', kicker:'LEARNING REPRESENTATIONS', title:'深度学习：让网络自己形成表示', en:'Layer-wise pretraining', people:['杰弗里·辛顿','扬·乐昆','约书亚·本吉奥'], glow:'#3d4e88', point:'少设计特征，让多层变换自己抽出结构。', text:'2006 年，辛顿、奥辛德罗与 Teh 用逐层预训练，让深层信念网络重新变得可训练。乐昆和本吉奥推动的表示学习更进一步：少做人工特征，让多层变换自己发现边缘、部件和概念。那时 GPU 还不是标准工具，但“深度”已经回到研究主线。'},

  {id:'gpt3', year:'2020', short:'GPT-3', gloss:'少样本规模', place:'1750 亿参数', kicker:'LANGUAGE MODELS ARE FEW-SHOT LEARNERS', title:'GPT-3：规模变成一种方法', en:'175 billion parameters', people:['Tom B. Brown 等'], glow:'#35588a', point:'提示里的几个例子，开始代替为每个任务单独微调。', text:'2020 年的 GPT-3 把参数规模推到约 1750 亿。论文展示，只在提示里放上几个例子，模型就能尝试翻译、问答、算术和代码。规模本身成了方法，提示也成了一种使用技能。幻觉、偏见和算力成本同时变得无法忽视。'},

  {id:'reason', year:'2024–', short:'推理模型', gloss:'先想再做', place:'推理时计算 · Agentic AI', kicker:'REASONING AND AGENTIC AI', title:'先推理，再把任务做完', en:'Spend compute before the answer', people:['OpenAI o1','DeepSeek-R1 等'], glow:'#4d4a86', point:'额外计算被花在回答之前，并接上工具与长时间任务。', text:'2024 年的 o1 与 2025 年的 DeepSeek-R1 等模型，用更长的思考过程换取数学、代码和复杂规划上的可靠性。当这种推理再接上工具、记忆和可以持续一段时间的任务，就更接近 Agentic AI：不只交回一段文字，而对一个目标负责到可以检查的结果。权限、确认和审计因此更重要。'},

function defs(){
  return '<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
}
function dot(x,y,r=7){return `<circle cx="${x}" cy="${y}" r="${r}" fill="#d5e6ff" filter="url(#glow)"/>`;}
function nodeCircle(x,y,r=7){return `<circle cx="${x}" cy="${y}" r="${r}" fill="#101722" stroke="#c5dcff" stroke-width="1.6"/>`;}
function svg(label, body){
  return `<svg viewBox="0 0 520 520" role="img" aria-label="${label}">${defs()}<g fill="none" stroke="#c5dcff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${body}</g></svg>`;
}
function photo(label, src){
  return `<img src="${src}" alt="${label}">`;
}

  flashTimer=0;
}
function startNetFlash(){
  stopNetFlash();
  const gen=flashGen;
  const pulse=()=>{
    if(gen!==flashGen) return;
    art.querySelectorAll('.net-node').forEach((n,i)=>setTimeout(()=>{
      if(gen!==flashGen||!n.isConnected) return;
      n.classList.add('flash');
      setTimeout(()=>{if(n.isConnected) n.classList.remove('flash')},700);
    },i*90));
  };
  pulse();
  flashTimer=setInterval(pulse,3000);
}
const bios={
'艾伦·图灵':`<p>艾伦・图灵（Alan Mathison Turing，1912.6.23－1954.6.7）<br>英国数学家、逻辑学家、密码学家、计算机科学之父、人工智能之父。</p><p>1. 早年：出生于伦敦，少年时就展现极强数理天赋，1931 年进入剑桥大学国王学院，研究数理逻辑；1936 年发表里程碑论文《论可计算数》，提出<b>图灵机</b>。</p><p>2. 二战时期（核心贡献）：二战期间，德军使用恩尼格玛（Enigma）密码机加密通信。图灵在布莱切利园主导密码破译工作，设计破译机器<b>Bombe</b>，成功破解恩尼格玛密码。普遍认为这项工作至少将二战缩短 2–4 年，挽救了数百万生命。</p><p>3. 战后：1945 年之后，参与 ACE 自动计算机研发，提出<b>存储程序计算机</b>的构想；1950 年发表《计算机器与智能》，提出著名的<b>图灵测试</b>，第一次正式探讨机器能否思考，奠定人工智能的思想起点。</p><p>4. 悲剧结局：图灵是同性恋，在当时英国法律下属于“严重猥亵”罪名。1952 年被定罪，被迫接受化学阉割（激素治疗）。1954 年，在家中离世，官方结论为食用浸氰化物的苹果自杀。</p><p>后续平反：2009 年英国政府公开道歉；2013 年，英国女王给予图灵<b>皇家赦免</b>。</p>`,
'约翰·麦卡锡':`<p>约翰·麦卡锡（John McCarthy，1927.9.4－2011.10.24）<br>美国计算机科学家，Lisp 语言的设计者，也是把这一领域命名为人工智能的人。</p><p>1. 早年：生于波士顿，1951 年在普林斯顿获得数学博士。他关心的不是把一台机器做快，而是怎样把推理写成可以执行的步骤。</p><p>2. 达特茅斯：1956 年，他发起达特茅斯夏季研讨，并在提案里第一次使用 <b>Artificial Intelligence</b> 这个名字。会议没有交出通用方法，学科却因此有了共同称呼。</p><p>3. Lisp 与实验室：1958 年他设计 Lisp，用符号、递归和列表来写推理程序，成为早期人工智能的主要语言。1962 年到斯坦福，参与建立人工智能实验室，并提出“建议接受者”：程序应当能接受建议，再改进自己的行为。</p><p>4. 立场：他长期相信智能的核心是逻辑和知识表示，对只靠大量连接去学习的路线保持批评。1971 年获得图灵奖。2011 年在斯坦福去世。</p>`,
'马文·明斯基':`<p>马文·明斯基（Marvin Minsky，1927.8.9－2016.1.24）<br>美国认知科学家，麻省理工学院人工智能实验室的联合创始人。</p><p>1. 早年：在哈佛和普林斯顿学习，1951 年就建造过早期神经网络机器 SNARC，用真空管模拟神经元之间的连接。他很早就同时接触过连接和符号两条路。</p><p>2. 实验室：1958 年与麦卡锡在麻省理工学院建立人工智能项目，后来发展成独立实验室。这里训练出一代研究者，也把机器人、视觉和常识推理放进同一间屋子。</p><p>3. 理论：1970 年代他用“框架”描述常识：人理解一个场景时，会调用一套带默认值的结构。1986 年《心智社会》进一步主张，智能不是一个中央程序，而是许多简单主体互相协作的结果。</p><p>4. 感知机争论：1969 年他与西摩·帕珀特出版《感知机》，从数学上指出单层网络处理不了异或。这本书常被看作连接主义进入低谷的原因之一。1969 年他获得图灵奖。</p>`,
'克劳德·香农':`<p>克劳德·香农（Claude Shannon，1916.4.30－2001.2.24）<br>美国数学家、电气工程师，信息论的建立者。</p><p>1. 早年：密歇根大学毕业后进入麻省理工学院。1937 年的硕士论文把布尔代数用到继电器和开关电路上，说明逻辑可以做成电路。这篇论文后来成为数字计算机的一块地基。</p><p>2. 信息论：1948 年发表《通信的数学理论》，定义信息熵和信道容量，证明噪声存在时仍然可以有可靠通信的极限。压缩、编码和后来的机器学习，都沿用这套语言。</p><p>3. 与智能相邻的工作：1950 年他讨论怎样给计算机编写国际象棋程序，把搜索和局面评估写成可以计算的步骤；又造出会走迷宫、记住路径的机械鼠 Theseus。1956 年他参加达特茅斯会议，是四位发起人之一。</p><p>4. 晚年：长期在贝尔实验室和麻省理工学院。他并不以“人工智能学者”自居，但给这个领域留下了比特、噪声和搜索这些至今还在用的概念。2001 年去世。</p>`,
'纳撒尼尔·罗切斯特':`<p>纳撒尼尔·罗切斯特（Nathaniel Rochester，1919.1.14－2001.6.8）<br>美国计算机工程师，IBM 早期大型计算机的主要设计者之一，达特茅斯会议的四位发起人之一。</p><p>1. 早年：毕业于麻省理工学院，第二次世界大战期间参与雷达相关的工程工作。他的训练来自做出能运行的机器，而不是只写理论。</p><p>2. IBM 701：加入 IBM 之后，他主持科学计算机 IBM 701 的体系设计。这是 IBM 第一台大规模生产的电子计算机，把“可存储程序的机器”推进到可以交付的产品。</p><p>3. 达特茅斯：1955 年，他与麦卡锡、明斯基、香农一起起草夏季研讨的提案，并代表 IBM 提供支持。提案相信，学习的各个方面都可以被精确描述，再交给机器去模拟。</p><p>4. 位置：四人里他最少被单独讲述。会议能开成，不只是因为有人提出名字，也因为产业界愿意拿出计算时间。会后他继续在 IBM 做计算机与早期模式识别。2001 年去世。</p>`,
'艾伦·纽厄尔':`<p>艾伦·纽厄尔（Allen Newell，1927.3.19－1992.7.19）<br>美国计算机科学家，与赫伯特·西蒙一起建立了“用符号求解问题”的研究传统。</p><p>1. 早年：学过物理和数学，在兰德公司研究后勤与组织，开始用计算机模拟人的决策。他关心的问题是：人在解一道题时，下一步到底是怎么选出来的。</p><p>2. 逻辑理论家：1956 年，他与西蒙、克利福德·肖完成 Logic Theorist，证明了《数学原理》里的一部分定理。它常被称作第一个人工智能程序：不是数值计算，而是在符号上搜索证明。</p><p>3. 通用问题求解：随后的通用问题求解器用“手段—目的分析”，先看当前状态和目标差在哪里，再挑选能缩小差距的操作。1970 年代，他与西蒙提出物理符号系统假设，认为符号的存储和变换足以产生智能行为。</p><p>4. 晚年：在卡内基梅隆大学研究认知架构 Soar，试图用同一套机制解释多种思维任务。1975 年与西蒙共同获得图灵奖。1992 年去世。</p>`,
'赫伯特·西蒙':`<p>赫伯特·西蒙（Herbert A. Simon，1916.6.15－2001.2.9）<br>美国学者，同时是经济学家、政治学家和认知科学家。</p><p>1. 有限理性：他不假设人能够算出全局最优，而认为人是在有限的时间、信息和注意力里寻找“够好”的决定。这个判断改变了经济学对理性的写法。1978 年他获得诺贝尔经济学奖。</p><p>2. 与纽厄尔合作：1950 年代起，两人一起做 Logic Theorist 和通用问题求解器，主张思维可以描述成对符号的操作。程序因此既是工程产物，也是一种关于人如何思考的理论。</p><p>3. 物理符号系统：1970 年代他们提出，一个能够存储符号、并对其进行比较和变换的系统，就具备产生智能行为的必要手段。这成为符号主义最清楚的纲领。</p><p>4. 跨学科：他在卡内基梅隆大学长期任教，把组织、经济和计算机看成同一种决策研究。1975 年与纽厄尔共同获得图灵奖。2001 年去世。</p>`,
'弗兰克·罗森布拉特':`<p>弗兰克·罗森布拉特（Frank Rosenblatt，1928.7.11－1971.7.11）<br>美国心理学家，感知机的提出者。</p><p>1. 早年：在康奈尔大学获得心理学博士，关心大脑怎样从例子里形成分类，而不是怎样把规则一条条写下来。他的起点是实验心理，不是后来的软件工程。</p><p>2. 感知机：1957 到 1958 年，他提出感知机。输入先乘上权重，加总之后与阈值比较，再按分对还是分错来调整权重。1958 年的 Mark I 用光电管读取简单图像，是一台会学习的硬件，而不只是纸上的公式。</p><p>3. 争议：他把结果讲得很有雄心，当时的报道出现过机器即将走路、说话、自我复制一类说法。1969 年，明斯基与帕珀特在《感知机》里指出，单层结构处理不了异或这类线性不可分的问题。经费和注意力随后转向符号路线。</p><p>4. 离世：1971 年，他在一次划船事故中去世，当天是他 43 岁生日。多层网络和反向传播要到 1980 年代才重新说明：权重学习这条路可以走得比单层更远。</p>`,
'沃伦·麦卡洛克':`<p>沃伦·麦卡洛克（Warren McCulloch，1898.11.16－1969.9.24）<br>美国神经生理学家，最早把神经元写成逻辑单元的人之一。</p><p>1. 训练：他先后学过哲学、心理学和医学，长期在实验室里研究神经系统。他想回答的是：一群会发放冲动的细胞，怎样产生可以称为思想的活动。</p><p>2. 1943 年的论文：与沃尔特·皮茨发表《神经活动内在思想的逻辑演算》。他们把神经元写成接收多个输入、超过阈值就发放的单元，并说明这样的网络可以实现命题逻辑里的与、或、非。</p><p>3. 影响：这篇论文同时进入控制论、计算机和后来的神经网络。冯·诺依曼讨论自动机时引用过它。它并不描述真实突触的全部细节，却给出一个可以计算的抽象。</p><p>4. 晚年：他在麻省理工学院的研究实验室继续做神经建模，坚持把大脑看成处理信号的网络。1969 年去世。感知机以及再后来的深层网络，都还用着“加权、求和、过阈值”这一基本形状。</p>`,
'沃尔特·皮茨':`<p>沃尔特·皮茨（Walter Pitts，1923.4.23－1969.5.14）<br>美国逻辑学家，自学成才，1943 年神经元模型的另一位作者。</p><p>1. 早年：在底特律长大，少年时期自学逻辑和数学，很早读到罗素与怀特海的《数学原理》。他没有按常规路径进入学术界，却很快出现在逻辑和神经科学的讨论里。</p><p>2. 合作：1943 年，他与麦卡洛克把神经元写成阈值逻辑单元，证明由这类单元组成的网络可以完成命题演算。这是把“神经活动”写成可计算装置的起点，比感知机还早十五年。</p><p>3. 控制论：他在芝加哥和麻省理工学院与维纳、莱特文等人共事，参与早期控制论。数学能力很强，发表却很少，许多工作留在谈话、笔记和合作者的论文里。</p><p>4. 后来：与维纳决裂之后，他逐渐离开研究，烧毁自己的手稿，生活变得孤立。1969 年因病去世。今天人们记得他，主要仍是因为那篇把神经冲动写成逻辑的论文。</p>`,
'詹姆斯·莱特希尔':`<p>詹姆斯·莱特希尔（James Lighthill，1924.1.23－1998.7.17）<br>英国应用数学家。他不是人工智能研究者，1973 年却写出了影响整个领域经费的报告。</p><p>1. 学术位置：他是流体力学权威，研究气动声学和生物如何在流体里运动，曾任剑桥大学卢卡斯数学教授。这个职位牛顿也担任过。英国科学研究理事会请他从外部评估人工智能。</p><p>2. 报告：1973 年的莱特希尔报告认为，自动推理和机器翻译能在限定题目里做演示，一旦进入真实的组合和常识，搜索就会爆炸。他把当时的研究分成自动化、中枢神经系统模拟和搭在两者之间的“桥梁”，并判断桥梁并没有如承诺那样接通。</p><p>3. 后果：报告成为英国收缩相关资助的重要依据，常与 1966 年美国对机器翻译的冷淡结论放在一起，被看作第一次寒冬的标志。实验室没有全部关闭，但“几年内实现通用智能”不再是可以写进预算的句子。</p><p>4. 本人：报告的力量来自对照：一位外部数学家拿着已发表的结果，去核对公开的承诺。1998 年，他在游泳时去世。</p>`,
'资助机构与实验室':`<p>资助机构与实验室<br>这一格不是一个人，而是第一次寒冬里决定项目还能不能继续的那些机构和实验室。</p><p>1. 谁在出钱：1960 年代，美国高等研究计划局（后来的 DARPA）、英国的科学研究理事会，以及若干大学实验室，支撑着机器翻译、定理证明和早期机器人。许多项目直接靠一笔多年的拨款活着。</p><p>2. 当时的期待：申请书常常许诺，几年之内做出实用翻译或通用推理。系统在词汇表很小、规则写死的题目上能够运行，一遇到开放文本、歧义和常识，就反复失败。</p><p>3. 收缩：1966 年美国 ALPAC 报告已经让机器翻译的热情冷却；1973 年莱特希尔报告之后，英国的相关拨款明显减少。实验室被迫改做更窄、更容易在当期交付的题目。</p><p>4. 留下的东西：停掉的是不加边界的承诺，不是计算本身。搜索、符号程序和知识表示的经验还在，下一轮经费回来时，它们以专家系统这种更小的范围重新出现。</p>`,
'爱德华·费根鲍姆':`<p>爱德华·费根鲍姆（Edward Feigenbaum，1936.1.20－）<br>美国计算机科学家，提出“知识工程”，把专家系统从个别程序变成一条路线。</p><p>1. 师承：在卡内基工学院受赫伯特·西蒙影响，从研究人怎样解决问题，转向把一个行业里的专业知识放进程序。他后来长期在斯坦福任教。</p><p>2. DENDRAL：1960 年代，他与遗传学家、化学家合作，让程序根据质谱推断有机分子的结构。系统真正起作用的不是更聪明的通用搜索，而是化学家愿意写下来的那些规则。</p><p>3. 知识工程：他由此提出，专家系统的瓶颈是获取知识和整理知识。推理引擎可以相对通用，知识库却必须按领域一条一条写。这个判断把研究从“做一个万能推理机”拉回到“先做一个窄的、能用的系统”。</p><p>4. 影响：MYCIN、XCON 以及 1980 年代的一批商业系统，都沿着这条路往下走，也一起继承了高昂的维护成本。1994 年，他与拉吉·雷迪共同获得图灵奖。</p>`,
'爱德华·肖特利夫':`<p>爱德华·肖特利夫（Edward H. Shortliffe，1947－）<br>美国医学信息学家，MYCIN 的主要设计者。</p><p>1. 训练：他同时走医学和计算机，在斯坦福把博士论文做成一个会讨论细菌感染、并给出抗生素建议的程序。使用者是医生，题目是真实的临床决策，而不是棋盘或定理。</p><p>2. MYCIN：1970 年代中期，系统用几百条“如果……那么……”规则，根据化验和症状推断可能的病原，再建议用药。规则并不总是确定的，他用确信因子表示一条证据对结论的支持有多强。</p><p>3. 评价与限制：在回顾性病例上，MYCIN 的建议可以和感染科医生相比较。它没有进入日常临床。原因包括当时终端不好用、医生要为最终决定负责，以及知识库每次更新都得人工改规则。</p><p>4. 留下的结构：分开的知识库、推理机，以及能够回答“为什么问这一句”。后来的医学信息学和专家系统外壳，沿用的是这套结构，而不只是当年那一张准确率表。</p>`,
'杰弗里·辛顿':`<p>杰弗里·辛顿（Geoffrey Hinton，1947.12.6－）<br>英国出生的计算机科学家，长期在加拿大工作，是深度学习重新成为主线的主要推动者。</p><p>1. 早期：学的是实验心理和人工智能。1970 年代他就在研究神经网络怎样用误差学习，当时符号方法和专家系统占着经费，这条路线几乎无人问津。</p><p>2. 反向传播：1986 年，他与戴维·鲁梅尔哈特、罗纳德·威廉姆斯发表论文，把输出端的误差从后往前逐层传回，每一层的权重都可以按自己的责任调整。多层网络因此不再停在无法训练的状态。</p><p>3. 深度网络：2006 年，他用逐层预训练让深层信念网络重新变得可训练。2012 年，他的学生做出 AlexNet，深层卷积在 ImageNet 上明显拉开与传统视觉的差距。他长期在多伦多大学任教，并曾在谷歌工作。</p><p>4. 近年：2018 年与扬·乐昆、约书亚·本吉奥同获图灵奖；2024 年与约翰·霍普菲尔德同获诺贝尔物理学奖。离开谷歌之后，他多次公开提醒，更强的模型可能带来难以收回的风险。</p>`,
'戴维·鲁梅尔哈特':`<p>戴维·鲁梅尔哈特（David Rumelhart，1946.6.12－2011.3.13）<br>美国认知心理学家，并行分布处理的核心作者，1986 年反向传播论文的第一作者。</p><p>1. 问题从哪里来：他在斯坦福研究阅读和概念学习，关心人怎样从例子里形成内部表示。对他来说，学习算法首先是一种关于认知的理论，其次才是工程工具。</p><p>2. 1986 年：与辛顿、威廉姆斯发表《通过反向传播误差学习表示》。同一年主编《并行分布处理》，两卷书把神经网络重新放回认知科学的讨论中心，并给出可以自己实现的算法和仿真。</p><p>3. 主张：知识可以住在大量连接的权重里，不必每一条都写成符号规则。这和当时占主流的专家系统直接对照：一边在扩充规则库，一边在训练分布式表示。</p><p>4. 晚年：1990 年代他被诊断为皮克病，一种额颞叶痴呆，逐渐无法继续研究。2011 年去世。反向传播成为训练深层网络的常规方法，是在他离开一线之后。</p>`,
'罗纳德·威廉姆斯':`<p>罗纳德·威廉姆斯（Ronald J. Williams）<br>美国计算机科学家，1986 年反向传播论文的第三位作者。</p><p>1. 当时的位置：他在加州大学圣迭戈，与鲁梅尔哈特的并行分布处理小组相邻，负责把学习规则写成可以重复计算的形式。公众后来更常提起辛顿，论文本身是三个人的工作。</p><p>2. 论文做了什么：1986 年的文章说明，只要每一层都由可微的单元组成，输出端的误差就可以用链式法则分到每一个权重上。多层网络从此有了统一的训练步骤，而不必为每种结构另写一套学习规则。</p><p>3. 序列：他随后提出实时循环学习（RTRL），讨论循环网络怎样随时间把误差传回去。问题比后来常用的“沿时间反向传播”更早被正式写出来：序列不是一张静态的图。</p><p>4. 之后：他长期在美国东北大学任教，继续研究循环网络和强化学习里的信用分配。反向传播能从一篇论文变成课程里的标准推导，依赖的就是这种把步骤写清楚的工作。</p>`,
'专家系统产业':`<p>专家系统产业<br>这一格不是一个人，而是 1980 年代把“如果……那么……”做成生意的那一批公司和产品。</p><p>1. 真正进了生产线的例子：数字设备公司的 XCON 用规则配置 VAX 计算机订单，处理的是真实合同，而不是演示数据。它说明知识库可以减少人工配单的错误。</p><p>2. 硬件与外壳：Symbolics 等公司出售专门跑 Lisp 的机器；另一批公司出售专家系统外壳，企业只要把老师傅的经验填进去。咨询市场把预期推得很高，仿佛每个部门都能买到一个专家。</p><p>3. 维护成本：规则要专家反复口述，遇到条例、产品和例外的变化，就得人工改库。系统不会从新的订单里自己学会一条规则。专用机器价格高，普通工作站的性能追上来之后，硬件理由也不再成立。</p><p>4. 退潮：1987 年前后订单下滑，不少公司收缩或改做别的软件。留下的教训不是“规则无用”，而是窄领域可以编码，但编码之后的维护成本必须先算进去。</p>`,
'实验室与资助方':`<p>实验室与资助方<br>这一格是第二次寒冬里重新决定预算的大学实验室、企业和政府计划。</p><p>1. 谁在退：企业削减专家系统预算，一部分 Lisp 机器公司退出市场。大学里那些以手工知识库为中心、却缺少新数据和新指标的大项目，不再容易拿到延续经费。</p><p>2. 日本第五代：通产省的第五代计算机计划曾承诺，用逻辑编程和并行机器实现新一代智能。计划结束时，没有交出宣传中的通用系统，也影响了外界对符号路线的信心。</p><p>3. 钱转向哪里：资助方更愿意支持能用数据衡量的题目。统计学习、概率图模型和还很小的神经网络小组，在更紧的预算里继续做实验。</p><p>4. 结果：第二次退潮再次说明，能做一次成功演示，和能以低成本跟上新情况，不是同一件事。研究没有归零，被允许提出的问题换了。</p>`,
'弗拉基米尔·万普尼克':`<p>弗拉基米尔·万普尼克（Vladimir Vapnik，1936.12.6－）<br>出生于苏联的数学家，统计学习理论的建立者之一。</p><p>1. 早年：在莫斯科的控制科学研究所工作，与阿列克谢·切尔沃年基斯提出 VC 维，用来描述一个函数族能把数据分成多少种不同样子。模型不是越大越好，复杂度本身可以被定义。</p><p>2. 泛化：他们证明，训练集上的误差和在新数据上的误差之间，隔着样本数量与函数族容量的关系。机器学习第一次有了一张“凭什么能推广”的数学契约，而不只是调到训练集全对。</p><p>3. 支持向量机：1990 年代他在 AT&T 贝尔实验室，与科琳娜·科尔特斯等人把最大间隔分类做成支持向量机。只让最靠近分界面的那些样本决定边界。它在文本和许多分类任务上非常能打。</p><p>4. 之后：核函数让线性的间隔方法用到非线性数据上。深层网络兴起以后，工业系统更少直接调用支持向量机，但正则、间隔和泛化这些要求，仍然来自他写下的那套界。</p>`,
'扬·乐昆':`<p>扬·乐昆（Yann LeCun，1960.7.8－）<br>法国计算机科学家，卷积神经网络的主要建立者。</p><p>1. 早年：在巴黎学习，博士阶段就研究反向传播可以做什么。随后到美国贝尔实验室，面对的是真实的手写数字，而不是只在小玩具数据上把损失降下去。</p><p>2. 卷积网络：1989 年前后，他用权值共享的卷积层识别手写数字。网络只看局部笔画，同一组检测器在整张图上滑动。这套结构后来称为 LeNet，美国邮政分拣和银行支票系统里使用过它。</p><p>3. 低谷：1990 年代到 2000 年代中期，主流更相信手工特征和浅层分类器。卷积网络计算贵，数据也还不够。他仍然认为表示应该学出来，而不是由人先设计好边缘和角点。</p><p>4. 现在：2012 年之后，卷积成为视觉的默认骨架。他在纽约大学任教，并担任 Meta 的首席人工智能科学家。2018 年与辛顿、本吉奥同获图灵奖。</p>`,
'约书亚·本吉奥':`<p>约书亚·本吉奥（Yoshua Bengio，1964.3.5－）<br>加拿大计算机科学家，深度学习三位主要推动者之一，蒙特利尔学习算法研究所 Mila 的创始人。</p><p>1. 早年：在麦吉尔大学获得计算机博士，研究神经网络和序列。他选择留在蒙特利尔建实验室。Mila 后来成为表示学习和语言模型的重要据点。</p><p>2. 表示学习：他强调多层网络的价值，是形成可以迁移到新任务的表示，而不是为每一个任务重新设计特征。词向量、语言建模和深层结构的许多早期实验，都从这个判断长出来。</p><p>3. 序列与注意力：2014 年，巴赫达瑙、Cho 与他提出神经机器翻译里的注意力：生成每一个词时，去对准源句里相关的位置。问题还是对齐，架构还不是后来的 Transformer，但“不要只靠一个固定的隐藏状态”已经说清楚了。</p><p>4. 图灵奖与近况：2018 年与辛顿、乐昆共同获奖。近年他同时讨论模型能力和社会风险，主张更强的系统需要可以被检查的约束，而不能只靠使用时的自觉。</p>`,
'亚历克斯·克里热夫斯基':`<p>亚历克斯·克里热夫斯基（Alex Krizhevsky）<br>计算机科学家，2012 年 AlexNet 的第一作者。模型用他的名字命名。</p><p>1. 当时的身份：多伦多大学杰弗里·辛顿的学生。ImageNet 已经有了百万级标注图像，多数参赛系统仍靠手工特征和浅层分类器。他把深层卷积真正训练到了这个规模上。</p><p>2. AlexNet：2012 年，他与伊利亚·苏茨克维、辛顿提交的网络使用两块 GPU、ReLU、Dropout 和大量数据增强，把 top-5 错误率降到约 15.3%，明显低于第二名。论文能复现，靠的是他写下的 GPU 训练代码。</p><p>3. 代码与工程：竞赛前后，他发布的 cuda-convnet 让其他实验室可以在消费级显卡上训练同类网络。转折不只是一个更低的错误率，而是一条别人下周就能照着做的训练路径。</p><p>4. 之后：他加入谷歌，参与把大规模视觉模型做成产品的早期工作，后来离开大公司。公开场合不多。2012 年那次提交仍然是视觉从手工特征转向深层卷积的分界。</p>`,
'伊利亚·苏茨克维':`<p>伊利亚·苏茨克维（Ilya Sutskever，1986－）<br>计算机科学家，生于苏联，在以色列和加拿大成长。AlexNet 的作者之一，后来成为 OpenAI 的联合创始人。</p><p>1. 学生时期：在多伦多大学跟随辛顿。他很早做序列模型和优化，相信把网络做深、把数据做大，会得到手工特征得不到的表示。</p><p>2. AlexNet：2012 年与克里热夫斯基、辛顿一起完成 ImageNet 上的深层卷积网络。他负责的部分包括把训练推进到当时的 GPU 能够承受的规模。这次结果让工业界开始按深度网络重新配置算力。</p><p>3. OpenAI：2015 年参与创建 OpenAI，长期担任首席科学家，推动 GPT 系列把“预测下一个词”扩展成通用模型。他重视规模，也反复谈论超出预期的能力会带来对齐问题。</p><p>4. 离开之后：2024 年他离开 OpenAI，创办致力于安全超级智能的新实验室。公开的履历因此分成两段：一段是把深度网络训练到能赢比赛和能对话，一段是追问这样的系统应当怎样被约束。</p>`,
'李飞飞':`<p>李飞飞（Fei-Fei Li，1976－）<br>华裔美国计算机科学家，ImageNet 的主要推动者，斯坦福大学以人为本人工智能研究所的联合创始人。</p><p>1. 早年：生于北京，少年时随家人到美国，在普林斯顿获得博士学位，之后到斯坦福任教。她的视觉研究从一开始就绑在一个问题上：没有足够大、足够干净的数据，算法无法学会真实世界的物体。</p><p>2. ImageNet：2009 年前后，她与邓嘉、李凯等同事发布按 WordNet 组织的大规模图像数据集，并用众包完成标注。它不是一个模型，而是一套让不同模型可以逐年比较的基准。</p><p>3. 比赛带来的转折：2010 年起的 ImageNet 大规模视觉识别挑战，给了 AlexNet 一个能够拉开差距的舞台。数据、评测和之后的 GPU 训练是三件一起发生的事。只记住网络、不记住数据集，会把转折讲偏。</p><p>4. 之后：她在斯坦福推动以人为本的人工智能研究，2017 至 2018 年曾担任谷歌云的首席科学家，之后回到学术机构，继续讨论视觉、机器人以及人工智能进入社会时的责任。</p>`,
'DeepMind AlphaGo 团队':`<p>DeepMind AlphaGo 团队<br>这一格是 2016 年把围棋下过人类顶尖水平的那支队伍，核心人物包括戴密斯·哈萨比斯、戴维·西尔弗和黄士杰。</p><p>1. 任务：围棋的合法局面多到无法穷举。传统程序靠手工局面评估，在职业水平上长期停滞。团队把策略网络、价值网络和蒙特卡洛树搜索接在一起：一个网络负责挑点，一个网络估计胜负，搜索再把两者嵌进推演。</p><p>2. 2016 年 3 月：在首尔，AlphaGo 以 4 比 1 战胜世界冠军李世石。对局向实验室以外的公众说明，学习来的评估可以进入规则清楚、分支极多的决策。</p><p>3. AlphaGo Zero：2017 年的后续系统主要依靠自我对弈，不再使用人类棋谱作为主要训练材料。它说明在规则完全已知的环境里，搜索加上学习可以自己产生出超出既有棋谱的下法。</p><p>4. 边界：棋盘有明确的胜负和完整的规则。这正是它能够自我对弈的原因，也是它不能直接代表开放世界任务的原因。团队后来把同样的思路延伸到蛋白质结构等问题，而不是停在一届比赛。</p>`,
'Ashish Vaswani 等八位作者':`<p>Ashish Vaswani 等八位作者<br>2017 年论文《Attention Is All You Need》的八位作者：Ashish Vaswani、Noam Shazeer、Niki Parmar、Jakob Uszkoreit、Llion Jones、Aidan N. Gomez、Łukasz Kaiser、Illia Polosukhin。当时他们大多在谷歌大脑或谷歌研究院。</p><p>1. 要换掉什么：在此之前，机器翻译主要靠循环网络或卷积按顺序处理句子。远距离的词要经过许多步才能互相影响，训练也不容易并行。</p><p>2. 自注意力：新结构让序列里任意两个位置直接比较，算出该看向谁。多头注意力同时保留几种关系，位置编码再把次序补回去。循环不再是骨架。</p><p>3. 当时的结果：论文首先用在机器翻译上，训练更快，质量也更好。它还不是后来的对话产品，只是一个更适合扩大规模的模块。</p><p>4. 之后：GPT 与 BERT 都把 Transformer 当作基本骨架。八位作者后来去向不同，有人继续做大规模训练和推理工具，有人创办新的研究公司。这篇论文留下的是结构，而不只是一张翻译排行榜。</p>`,
'Alec Radford 等':`<p>Alec Radford 等<br>这一格指以 Alec Radford 为第一作者、在 OpenAI 完成的一系列预训练工作，合作者包括 Karthik Narasimhan、Tim Salimans、伊利亚·苏茨克维等。</p><p>1. GPT：2018 年的论文证明，先在大量文本上从左到右预测下一个词，再在下游任务上微调，一个生成模型可以变成多种语言任务的起点。</p><p>2. GPT-2：2019 年把同样的方法扩大。模型能够写出更长、更连贯的续写。OpenAI 当时分阶段公布权重，理由是担心被用来批量生成误导内容。规模本身开始被当成需要讨论的风险。</p><p>3. 表示而不只是续写：Radford 还是 CLIP 的核心作者。CLIP 用数亿图文对做对比学习，让图像和文字落到可以互相检索的空间里。生成路线和多模态对齐，在同一个人的工作里接到了一起。</p><p>4. 方法上的遗产：先预训练、再用提示或微调去使用，成为后续 GPT-3 和对话模型的直接前身。这一格代表的是这条路线在 2018 到 2021 年被做成可重复论文的阶段。</p>`,
'Jacob Devlin 等':`<p>Jacob Devlin 等<br>这一格指 2018 年 BERT 论文的作者，第一作者是 Jacob Devlin，合作者包括 Ming-Wei Chang、Kenton Lee 和 Kristina Toutanova，当时在谷歌。</p><p>1. 和 GPT 的差别：GPT 从左往右预测下一个词。BERT 让每个词同时看见左右上下文，用掩码把句子里的一些词遮住，再训练模型把它们猜回来。双向阅读更适合分类、抽取和判断两句话的关系。</p><p>2. 预训练与微调：模型先在大规模文本上预训练，再在具体任务上换一个很小的输出层。问答、情感和自然语言推断不必各自从零设计特征。</p><p>3. 2018 到 2019 年的影响：BERT 公布后，一系列语言理解排行榜的成绩被迅速改写，实验室和公司开始把“先预训练一个编码器”当成默认流程。它和 GPT 一起证明，预训练本身比任何一个单独任务更重要。</p><p>4. 位置：后来的对话产品更多沿着生成式路线走，BERT 一类编码器仍然广泛用在搜索、排序和需要双向理解的内部系统里。这一格记下的是预训练的另一条读法。</p>`,
'Tom B. Brown 等':`<p>Tom B. Brown 等<br>这一格指 2020 年 GPT-3 论文《Language Models are Few-Shot Learners》的作者团队。Tom B. Brown 是第一作者，论文署名很长，来自 OpenAI。</p><p>1. 规模：模型参数约 1750 亿，训练语料是当时公开工作里少见的规模。论文要检验的不是再刷一个单独的排行榜，而是能力会不会随规模出现新的用法。</p><p>2. 少样本：只在提示里放上任务说明和几个例子，模型就能尝试翻译、问答、算术和代码，而不必为每个任务单独收集训练集、再做一次微调。提示开始成为一种使用技能。</p><p>3. 论文自己写下的限制：它会捏造事实，会延续训练文本里的偏见，调用一次的算力成本也高。这些不是事后才被发现的副作用，论文已经把它们列为不能忽略的问题。</p><p>4. 位置：GPT-3 还不是 2022 年那个面向公众的对话产品。它把“规模加上提示”确立为方法，也让后续的指令微调有了一个足够大的底模。</p>`,
'OpenAI':`<p>OpenAI<br>这一格是 2015 年在旧金山成立的研究公司，不是单独一位作者。早期参与者包括萨姆·奥尔特曼、伊隆·马斯克、格雷格·布罗克曼、伊利亚·苏茨克维等。</p><p>1. 成立时的说法：最初以非营利实验室的形式出现，目标写的是让通用人工智能惠及所有人，并关注安全。后来的组织结构改成有上限的营利实体，以便筹集训练大模型所需的计算。</p><p>2. 模型线：从 2018 年的 GPT、2019 年的 GPT-2，到 2020 年的 GPT-3，路线一直是大规模预测下一个词。2022 年 11 月 30 日，ChatGPT 对公众开放，用人类反馈把续写调成按指令对话。</p><p>3. 产品化：对话、编程助手、图像和后来的多模态、工具调用，把原来的论文界面变成普通人可以打开的窗口。使用方式变了，流畅程度也改变了公众对“机器写出来的文字”的预期。</p><p>4. 争议与约束：训练数据、安全测试、发布节奏和治理结构都持续被公开争论。作为时间线上的一个角色，它代表的是大模型从实验室样本变成日常工具的那一次组织化推动。</p>`,
'CLIP 与扩散模型研究':`<p>CLIP 与扩散模型研究<br>这一格是让“文字”和“图像”能够对齐、并让文字能够生成图像的两条研究，不是一位作者。</p><p>1. CLIP：2021 年，Alec Radford 等在 OpenAI 用数亿个图文对做对比学习。匹配的图和文在向量空间里靠近，不匹配的远离。模型因此可以按自然语言检索图像，也可以做零样本分类。</p><p>2. 扩散模型：Sohl-Dickstein 等人 2015 年已有早期形式；2020 年 Jonathan Ho、Ajay Jain 与 Pieter Abbeel 发表 DDPM，把生成写成“逐步去噪”。训练稳定之后，图像质量才达到可以公开比较的程度。</p><p>3. 落到产品：2022 年，罗姆巴赫等人的潜在扩散把去噪做在压缩后的空间里，Stable Diffusion 据此开放权重；同一时期 DALL·E 2、Imagen 等系统让“一句话生成一张图”变成可重复的演示。</p><p>4. 和后面的关系：多模态对话要解决的不是多一个上传按钮，而是图像、文字所指的是不是同一件事。CLIP 提供对齐，扩散模型提供生成。两者都还需要人来核对结果是否成立。</p>`,
'GPT-4V · Gemini 等团队':`<p>GPT-4V、Gemini 等团队<br>这一格是 2023 年把看图、读文档放进同一次对话的那些产品团队，主要包括 OpenAI 的 GPT-4V 和谷歌 DeepMind 的 Gemini。</p><p>1. 在此之前：图像分类、图文检索和文字对话大多是分开的系统。用户要先知道该把文件送到哪一个模型。2023 年的变化是把这些输入放进同一个对话窗口。</p><p>2. GPT-4V：在 GPT-4 的语言能力上接受图像。它能阅读截图、表格和简单场景，并按问题作答。能力依赖图像里真正可见的信息，也会把看不清的细节说得很确定。</p><p>3. Gemini：谷歌 DeepMind 在 2023 年 12 月发布的多模态模型，把文本、图像、音频和视频放进同一套训练和产品计划。随后的版本继续把实时语音和视频推进到交互里。</p><p>4. 这一步改变了什么：评测从“一张图一个标签”变成“一次对话里混合几种材料”。错误也更难发现，因为回答可以同时用到图和用户没有核对的背景知识。团队留下的是界面，核对仍然要由使用的人完成。</p>`,
'ReAct 等研究':`<p>ReAct 等研究<br>这一格指把推理和行动交替起来的研究，代表论文是 2022 年姚顺雨等人的 ReAct，合作者来自普林斯顿和谷歌。</p><p>1. 要解决的分裂：一边是只会一步步写推理过程、却不能查资料的模型；另一边是会调用工具、却不说明为什么调用的代理。两边单独使用时，错误都不容易定位。</p><p>2. ReAct 的写法：模型交替产生“想法”和“动作”。想法用来分解问题，动作去查询维基或调用接口，观察结果之后再决定下一步。轨迹是可以读的，而不只是最后一句答案。</p><p>3. 实验说明：在问答和简单的交互环境里，这种交替比只思考或只行动更不容易在中途走死。它也暴露出新的失败：模型会根据一次错误的观察继续编下去。</p><p>4. 位置：论文本身不是一个完整产品。2023 年之后的函数调用、智能体框架，很多都沿用了“想一步、做一步、看结果”这个循环。ReAct 把这个循环写成了可以引用的方法。</p>`,
'产品中的函数调用':`<p>产品中的函数调用<br>这一格不是一篇单独的论文，而是 2023 年起出现在产品里的能力：模型用结构化参数去调用外部函数。</p><p>1. 之前怎么做：如果想让模型查天气或访问业务接口，开发者往往在文本里约定一种格式，再靠字符串匹配去猜。格式一变，调用就断。</p><p>2. 2023 年 6 月：OpenAI 在接口中加入函数调用。开发者描述函数名和参数，模型返回一份按规定字段填好的参数，由程序真正执行。随后各家模型服务把同类能力做成工具、插件或连接器。</p><p>3. 改变的责任边界：模型不再只对一段文字负责，它提出的参数会碰到搜索、数据库和业务系统。参数填错，后果发生在系统里，而不只是发生在对话气泡里。</p><p>4. 因此要配套的东西：权限、确认、日志和失败后的退回。函数调用让“回答”变成“请求”，也使审计成为产品的一部分，而不是论文附录里的一句提醒。</p>`,
'OpenAI o1':`<p>OpenAI o1<br>这一格是 OpenAI 在 2024 年 9 月发布的推理模型系列，不是一位作者的名字。</p><p>1. 和普通对话模型的差别：它在给出可见回答之前，先花额外的计算做一段更长的内部推理。发布时的说法是，用更多“回答之前的计算”换数学、科学和编程题目上的可靠性。</p><p>2. 训练方式：OpenAI 说明使用了大规模强化学习，让模型学会把难题拆开、检查自己的步骤，而不是只模仿网上已有的解答。具体的训练细节没有完全公开。</p><p>3. 使用上的变化：同样一个问题，可以花更短或更长的思考时间。困难题目上等待变长，简单闲聊则不一定划算。成本从“每个词多少钱”变成“这道题允许想多久”。</p><p>4. 限度：更长的思考会减少一部分粗心错误，并不保证前提正确，也不会自动获得调用外部工具的权限。o1 在时间线上代表的是：额外计算被明确花在回答之前。</p>`,
'DeepSeek-R1 等':`<p>DeepSeek-R1 等<br>这一格是深度求索在 2025 年 1 月发布的推理模型，以及同一时期公开权重的同类模型。</p><p>1. 发布了什么：R1 用大规模强化学习训练推理过程，并公开了权重和技术报告。报告描述了先出现长链推理、再加以监督和偏好对齐的过程，也报告了一个较少依赖人工示范、主要靠强化学习的 R1-Zero。</p><p>2. 公开比较：在数学、代码和竞赛题等公开评测上，它被广泛拿来和当时的封闭推理模型对照。意义不只是某一个分数，而是同类能力可以在开放权重下被其他人检查和继续训练。</p><p>3. 成本叙事：训练和推理的花费被公开讨论，改变了“只有最大预算才能做出推理模型”的印象。具体账单仍要看硬件、数据和工程，不能从一次发布直接外推到所有任务。</p><p>4. 和 o1 放在一起：两者都把额外计算花在回答之前。差别在于开放的程度。对使用方来说，权重可以下载，并不代替对错误答案的核对，也不代替对数据与许可证的确认。</p>`,
'人与系统共同承担责任':`<p>人与系统共同承担责任<br>这一格不是某一个实验室，而是任务从“生成一段内容”交给系统去执行之后，必须同时在场的人和系统。</p><p>1. 为什么不能只写一个模型的名字：一旦系统可以查询、改写、调用接口并交付结果，出错的位置就不再只有最后那一段文字。工具选错、权限过大、中途没有停下，都是结果的一部分。</p><p>2. 人要决定的事：它能接触哪些数据，哪些动作必须先确认，做到哪一步算完成，失败时退回到哪里。这些决定不能等系统已经执行完再补进说明书。</p><p>3. 系统要留下的痕迹：每一步调用了什么、返回了什么、哪一次被人改过。没有日志，责任就无法从“是模型的问题”落到可以检查的动作上。</p><p>4. 这一格要说的话：能力变强不会自动回答“谁负责”。生成内容时，人核对的是成品；执行任务时，人授权的是过程。两者都要写清楚，结果才算有人接住。</p>`
};
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let bioTimer=0, bioBtn=null;
function hideBio(){
  clearTimeout(bioTimer);
  bioPop.hidden=true;
  if(bioBtn){bioBtn.removeAttribute('aria-expanded');bioBtn=null;}
}
function placeBio(btn){
  const pad=12, header=76, gap=10;
  const dockTop=document.querySelector('.dock').getBoundingClientRect().top;
  const r=btn.getBoundingClientRect();
  if(r.bottom<header||r.top>dockTop-8){hideBio();return;}
  const above=r.top-header-gap;
  const below=dockTop-r.bottom-gap;
  const placeAbove=above>=160||above>=below;
  const room=Math.max(140, Math.min(560, placeAbove?above:below));
  bioPop.style.maxHeight=room+'px';
  bioPop.style.width=Math.min(580, window.innerWidth-24)+'px';
  const h=bioPop.offsetHeight, w=bioPop.offsetWidth;
  let left=Math.min(Math.max(pad, r.left), window.innerWidth-pad-w);
  let top=placeAbove?r.top-h-gap:r.bottom+gap;
  if(top<header) top=header;
  if(top+h>dockTop-8) top=Math.max(header, dockTop-8-h);
  bioPop.style.left=left+'px';
  bioPop.style.top=top+'px';
}
function showBio(btn){
  const key=btn.getAttribute('data-who');
  if(!bios[key]) return;
  clearTimeout(bioTimer);
  bioBtn=btn;
  bioPop.innerHTML=bios[key];
  bioPop.hidden=false;
  placeBio(btn);
  document.querySelectorAll('.person[aria-expanded="true"]').forEach(b=>{if(b!==btn)b.removeAttribute('aria-expanded');});
  btn.setAttribute('aria-expanded','true');
}
function queueHide(){
  clearTimeout(bioTimer);
  bioTimer=setTimeout(hideBio, 180);
}
copyBlock.addEventListener('pointerover',e=>{const btn=e.target.closest('.person'); if(btn) showBio(btn);});
copyBlock.addEventListener('pointerout',e=>{
  const btn=e.target.closest('.person');
  if(!btn) return;
  const to=e.relatedTarget;
  if(to&&(btn.contains(to)||bioPop.contains(to))) return;
  queueHide();
});
bioPop.addEventListener('pointerenter',()=>clearTimeout(bioTimer));
bioPop.addEventListener('pointerleave',queueHide);
copyBlock.addEventListener('focusin',e=>{const btn=e.target.closest('.person'); if(btn) showBio(btn);});
copyBlock.addEventListener('focusout',e=>{
  const to=e.relatedTarget;
  if(to&&((e.target.closest('.person')&&e.target.closest('.person').contains(to))||bioPop.contains(to))) return;
  queueHide();
});
document.getElementById('copy').addEventListener('scroll',()=>{if(bioBtn&&!bioPop.hidden) placeBio(bioBtn);},{passive:true});
addEventListener('resize',()=>{if(bioBtn&&!bioPop.hidden) placeBio(bioBtn);});

function paint(){
  const e=events[index];
  exhibit.style.setProperty('--glow', e.glow);
  document.getElementById('exhibitIndex').textContent=pad(index+1);
  document.getElementById('exhibitKicker').textContent=e.kicker;
  document.getElementById('exhibitPlace').textContent=e.place;
  art.classList.toggle('photo', e.id==='turing'||e.id==='dartmouth');
  art.classList.toggle('pair', e.id==='perceptron');
  art.innerHTML=scene(e.id, e.title);
  if(e.id==='deep'||e.id==='alexnet') startNetFlash();
  else stopNetFlash();
  hideBio();
  const title=e.href?`<a href="${e.href.replace(/&/g,'&amp;')}" target="_blank" rel="noopener noreferrer">${e.title}</a>`:e.title;
  const who=e.people.map(p=>`<button type="button" class="person" data-who="${esc(p)}">${esc(p)}</button>`).join('');
  copyBlock.innerHTML=`<span class="tag">${pad(index+1)} / ${pad(events.length)} · ${e.short}</span><div class="year">${e.year}</div><h1>${title}</h1><p class="en">${e.en}</p><p class="lead">${e.text}</p><aside>${e.point}</aside><div class="who">${who}</div>`;
  nodes.forEach((node,i)=>{
    node.classList.toggle('active', i===index);
    if(i===index) node.setAttribute('aria-current','true');
    else node.removeAttribute('aria-current');
  });
  document.getElementById('fraction').textContent=`${pad(index+1)} / ${pad(events.length)}`;
  live.textContent=`${e.year}，${e.title}`;
  if(!playing) slideBar.style.width=(index/(events.length-1)*100)+'%';
  art.style.animation='none';
  copyBlock.style.animation='none';
  void art.offsetWidth;
  art.style.animation='';
  copyBlock.style.animation='';
}
function layoutRail(){
  if(!nodes.length) return;
  const inner=trackInner.getBoundingClientRect();
  const first=nodes[0].getBoundingClientRect();
  const last=nodes[nodes.length-1].getBoundingClientRect();
  const cur=nodes[index].getBoundingClientRect();
  const start=first.left+first.width/2-inner.left;
  const end=last.left+last.width/2-inner.left;
  const at=cur.left+cur.width/2-inner.left;
  rail.style.left=start+'px';
  rail.style.width=Math.max(0,end-start)+'px';
  railFill.style.width=Math.max(0,at-start)+'px';
}
function centerNode(smooth){
  const node=nodes[index];
  if(!node) return;
  const nodeRect=node.getBoundingClientRect();
  const trackRect=track.getBoundingClientRect();
  const delta=(nodeRect.left+nodeRect.width/2)-(trackRect.left+trackRect.width/2);
  track.scrollTo({left:track.scrollLeft+delta, behavior:smooth?'smooth':'auto'});
}
function show(i, smooth){
  index=Math.max(0, Math.min(events.length-1, i));
  paint();
  requestAnimationFrame(()=>{layoutRail();centerNode(smooth);});
}
function playLabel(){playBtn.textContent=playing?'暂停':ended?'重新放映':'开始放映';}
function stopPlayback(){
  playing=false;
  elapsed=0;
  cancelAnimationFrame(raf);
  playLabel();
}
function toggle(){
  if(playing){
    elapsed=performance.now()-started;
    playing=false;
    cancelAnimationFrame(raf);
    playLabel();
    return;
  }
  if(ended){
    ended=false;
    elapsed=0;
    show(0,false);
  }
  playing=true;
  started=performance.now()-elapsed;
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(tick);
  playLabel();
}
function tick(now){
  if(!playing) return;
  const p=Math.min(1,(now-started)/DURATION);
  slideBar.style.width=(p*100)+'%';
  if(p>=1){
    elapsed=0;
    if(index>=events.length-1){
      playing=false;
      ended=true;
      playLabel();
      slideBar.style.width='100%';
      return;
    }
    show(index+1,true);
    started=performance.now();
  }
  raf=requestAnimationFrame(tick);
}
function step(dir){
  const next=index+dir;
  if(next<0||next>=events.length) return;
  ended=false;
  elapsed=0;
  if(playing) started=performance.now();
  show(next,true);
}
function jump(i){
  if(suppressClick) return;
  if(i===index && !playing) return;
  stopPlayback();
  ended=false;
  show(i,true);
}

rail=document.createElement('div');
rail.className='rail';
railFill=document.createElement('i');
rail.append(railFill);
trackInner.append(rail);
events.forEach((e,i)=>{
  const b=document.createElement('button');
  b.type='button';
  b.className='node '+(i%2?'down':'up')+(e.future?' future':'');
  b.setAttribute('aria-label', `${e.year} ${e.short}，${e.gloss}`);
  b.innerHTML=`<i class="dot"></i><span class="card"><small>${e.year}</small><strong>${e.short}</strong><em>${e.gloss}</em></span>`;
  b.addEventListener('click',()=>jump(i));
  trackInner.append(b);
  nodes.push(b);
});

let dragging=false,moved=false,startX=0,startScroll=0,pointerId=0;
track.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse'||e.button!==0) return;
  dragging=true; moved=false; startX=e.clientX; startScroll=track.scrollLeft; pointerId=e.pointerId;
});
track.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const dx=e.clientX-startX;
  if(Math.abs(dx)>5 && !moved){
    moved=true;
    track.classList.add('dragging');
    track.setPointerCapture(pointerId);
  }
  if(moved) track.scrollLeft=startScroll-dx;
});
function endDrag(){dragging=false;track.classList.remove('dragging');}
track.addEventListener('pointerup',endDrag);
track.addEventListener('pointercancel',endDrag);
track.addEventListener('click',e=>{
  if(!moved) return;
  suppressClick=true;
  e.preventDefault();
  e.stopPropagation();
  moved=false;
  setTimeout(()=>{suppressClick=false;},0);
},true);
track.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)) return;
  track.scrollLeft+=e.deltaY;
  e.preventDefault();
},{passive:false});

playBtn.addEventListener('click',toggle);
document.getElementById('prev').addEventListener('click',()=>step(-1));
document.getElementById('next').addEventListener('click',()=>step(1));
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||(e.target.closest&&e.target.closest('.person'))) return;
  if(e.key==='ArrowRight'){e.preventDefault();step(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
  else if(e.key===' '){e.preventDefault();toggle();}
  else if(e.key==='Home'){e.preventDefault();jump(0);}
  else if(e.key==='End'){e.preventDefault();jump(events.length-1);}
});
window.addEventListener('resize',()=>{layoutRail();centerNode(false);});
show(0,false);
playLabel();
</script>
</body>
</html>
